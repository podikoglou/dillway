[project]
name = "dw-engine"
version = "0.1.0"
description = "dillway anti-cheat training pipeline: R2 dataset in, trained via Modal, ONNX out to R2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal==1.6.3",
    "scikit-learn==1.9.1",
    "skl2onnx==1.20.0",
    "onnx==1.23.2",
    "onnxruntime==1.31.1",
    "numpy==2.5.4",
    "pyarrow==26.0.1",
    "python-dotenv==1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_engine"]
