# Recording, labeling and model settings.

# Cheat labels offered when a recording stops. Also the model names the plugin
# refreshes from R2. Add a cheat here before recording its first training data;
# models found under the models prefix add themselves automatically.
cheats:
  - speed

prediction:
  # A recording is flagged when any window reaches this cheat probability.
  threshold: 0.5

watch:
  # How often a watched player is predicted on.
  interval-seconds: 5
  # Where the live state shows up. `actionbar` writes it above the hotbar and
  # leaves chat alone; `chat` prints the full report when a verdict changes
  # instead. A console always uses `chat`: it has no hotbar.
  display: actionbar

models:
  # Download the newest model for every cheat at startup. Without this the
  # plugin uses the last models cached under plugins/dw-agent/models/.
  refresh-on-startup: true
  # Object prefix in the bucket:
  #   models/<cheat>/<version>/model.onnx
  #   models/<cheat>/latest.json   (points at the newest version)
  prefix: "models"

# Recording storage and model downloads share these credentials.
s3:
  enabled: false
  endpoint: "https://<account-id>.r2.cloudflarestorage.com"
  # R2 serves the S3 API in path style (<endpoint>/<bucket>/<key>).
  path-style: true
  bucket: "dillway"
  access-key-id: ""
  secret-access-key: ""
  # Recording object keys are <key-prefix>/<label>/<started>.parquet, with the
  # label grouping legit and cheat sessions. Empty prefix drops the level.
  key-prefix: "recordings"
